<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NameForgeV0.9</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { color: #4ce1ff; }
  select, input, button { padding: 10px; margin: 5px; font-size: 16px; }
  #name-output { margin-top: 20px; font-size: 20px; color: #ffb74d; text-align: center; }
</style>
</head>
<body>

<h1>NameForgeV0.9</h1>

<label for="category">Select Type:</label>
<select id="category">
  <option value="real">Real Name</option>
  <option value="fantasy">Fantasy Male</option>
</select>

<label for="gender">Select Gender:</label>
<select id="gender">
  <option value="all">All</option>
  <option value="male">Male</option>
  <option value="female">Female</option>
</select>

<label for="count">Number of names:</label>
<input type="number" id="count" value="5" min="1" max="50">

<button id="generate-btn">Generate Names</button>

<div id="name-output">Names will appear here</div>

<script>
// ----- Human-sounding fantasy male generator -----
const syllables = ["ar","el","dor","thal","ka","nim","ron","rik","vek","ald","rak","isk","lan","sy"];
const glottalSuffixes = ["'r","'k","'s","'l","'n"];
const multiSuffixes = ["ron","ar","rik","vek","ald","rak","isk","lan"];
const forbiddenLetters = /[cCzZ]/g;

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function generateFantasyMaleName(){
  let name = pick(syllables).charAt(0).toUpperCase() + pick(syllables).slice(1);
  let syllableCount = Math.random() < 0.7 ? 2 : 3; // 2-3 syllables

  for(let i=1; i<syllableCount; i++){
    let next = pick(syllables);

    // Avoid repeating sounds
    while(next.charAt(0).toLowerCase() === name.slice(-1).toLowerCase()){
      next = pick(syllables);
    }

    name += next;
  }

  // Decide on suffix type
  let useGlottal = Math.random() < 0.5; // 50% chance
  if(useGlottal){
    let suffix = pick(glottalSuffixes);
    // only attach glottal if previous letter is not vowel for natural pause
    if(!"aeiou".includes(name.slice(-1).toLowerCase())){
      name += suffix;
    } else {
      // fallback: pick multi-letter suffix
      name += pick(multiSuffixes);
    }
  } else {
    name += pick(multiSuffixes);
  }

  // Remove forbidden letters
  name = name.replace(forbiddenLetters,"");

  // Capitalize first letter
  name = name.charAt(0).toUpperCase() + name.slice(1);

  return name;
}

// ----- Main generator function -----
async function generateNames() {
  const category = document.getElementById("category").value;
  const gender = document.getElementById("gender").value;
  const count = parseInt(document.getElementById("count").value) || 1;
  let names = [];

  try {
    if(category === "real") {
      let apiURL = `https://randomuser.me/api/?results=${count}&inc=name&nat=us,gb,ca,au,nz`;
      if(gender !== "all") apiURL += `&gender=${gender}`;
      const res = await fetch(apiURL);
      const data = await res.json();
      names = data.results.map(u => `${u.name.first} ${u.name.last}`);
    } else if(category === "fantasy") {
      for(let i=0;i<count;i++){
        names.push(generateFantasyMaleName());
      }
    }
  } catch(err) {
    names = ["Error: " + err.message];
  }

  document.getElementById("name-output").innerHTML = names.join("<br>");
}

document.getElementById("generate-btn").addEventListener("click", generateNames);
</script>

</body>
</html>
