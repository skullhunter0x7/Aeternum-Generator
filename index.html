<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NameForge v0.12</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { color: #4ce1ff; }
  select, input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
  }
  #name-output {
    margin-top: 20px;
    font-size: 20px;
    color: #ffb74d;
    text-align: center;
  }
</style>
</head>
<body>

<h1>NameForge v0.12</h1>

<label for="category">Select Type:</label>
<select id="category">
  <option value="real">Real Name</option>
  <option value="fantasy">Fantasy Male</option>
</select>

<label for="gender">Select Gender:</label>
<select id="gender">
  <option value="all">All</option>
  <option value="male">Male</option>
  <option value="female">Female</option>
</select>

<label for="count">Number of names:</label>
<input type="number" id="count" value="5" min="1" max="50">

<button id="generate-btn">Generate Names</button>

<div id="name-output">Names will appear here</div>

<script>
// ---------- Fantasy rules (human flow) ----------

// Simple, pronounceable syllables
const onsets = ["d","t","k","n","m","l","r","s","th","v"];
const vowels = ["a","e","i","o","u"];
const codas = ["l","n","r","m","k","s","d","v"];

// Allowed suffixes ONLY
const suffixes = ["'r","'k","'s","'l","'n","ron","ar","rik","vek","ald","rak","isk","lan'r"];

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function makeSyllable(allowCoda = true) {
  let s = pick(onsets) + pick(vowels);
  if (allowCoda && Math.random() < 0.5) {
    s += pick(codas);
  }
  return s;
}

function generateFantasyMaleName() {
  // 1–2 syllables max before suffix
  let syllableCount = Math.random() < 0.7 ? 1 : 2;
  let base = "";

  for (let i = 0; i < syllableCount; i++) {
    base += makeSyllable(i === 0);
  }

  let suffix = pick(suffixes);

  // Prevent same-letter collision before suffix
  const lastBaseChar = base.slice(-1);
  const firstSuffixChar = suffix.replace("'", "").charAt(0);
  if (lastBaseChar === firstSuffixChar) {
    base = base.slice(0, -1);
  }

  let name = base + suffix;

  // Final cleanup rules
  name = name
    .replace(/[cC]/g, "")     // no C
    .replace(/([aeiou])\1/g, "$1") // no double vowels
    .replace(/el'l/g, "el")   // hard ban
    .toLowerCase();

  // Capitalize first letter only
  name = name.charAt(0).toUpperCase() + name.slice(1);

  return name;
}

// ---------- Main generator ----------
async function generateNames() {
  const category = document.getElementById("category").value;
  const gender = document.getElementById("gender").value;
  const count = parseInt(document.getElementById("count").value) || 1;
  let names = [];

  try {
    if (category === "real") {
      let apiURL = `https://randomuser.me/api/?results=${count}&inc=name&nat=us,gb,ca,au,nz`;
      if (gender !== "all") apiURL += `&gender=${gender}`;
      const res = await fetch(apiURL);
      const data = await res.json();
      names = data.results.map(u => `${u.name.first} ${u.name.last}`);
    } else {
      for (let i = 0; i < count; i++) {
        names.push(generateFantasyMaleName());
      }
    }
  } catch (err) {
    names = ["Error: " + err.message];
  }

  document.getElementById("name-output").innerHTML = names.join("<br>");
}

document.getElementById("generate-btn")
  .addEventListener("click", generateNames);
</script>

</body>
</html>
