<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NameForge v0.13</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { color: #4ce1ff; }
  select, input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
  }
  .section {
    border: 1px solid #333;
    padding: 15px;
    margin-top: 20px;
    width: 100%;
    max-width: 500px;
    text-align: center;
  }
  #name-output {
    margin-top: 15px;
    font-size: 20px;
    color: #ffb74d;
  }
</style>
</head>
<body>

<h1>NameForge v0.13</h1>

<!-- EXISTING GENERATOR -->
<div class="section">
  <label for="category">Select Type:</label>
  <select id="category">
    <option value="real">Real Name</option>
    <option value="fantasy">Fantasy Male</option>
  </select>

  <label for="gender">Select Gender:</label>
  <select id="gender">
    <option value="all">All</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>

  <label for="count">Number of names:</label>
  <input type="number" id="count" value="5" min="1" max="50">

  <button id="generate-btn">Generate Names</button>

  <div id="name-output"></div>
</div>

<!-- NEW: MANUAL BASE NAME + ENDINGS -->
<div class="section">
  <h3>Add Endings to a Name</h3>

  <input
    type="text"
    id="base-name"
    placeholder="Enter base name (e.g. Dor, Thal, Eli)"
  >

  <button id="ending-btn">Generate Variants</button>

  <div id="ending-output"></div>
</div>

<script>
// ---------- EXISTING FANTASY LOGIC (UNCHANGED) ----------

// Simple, pronounceable syllables
const onsets = ["d","t","k","n","m","l","r","s","th","v"];
const vowels = ["a","e","i","o","u"];
const codas = ["l","n","r","m","k","s","d","v"];

// Allowed suffixes ONLY
const suffixes = ["'r","'k","'s","'l","'n","ron","ar","rik","vek","ald","rak","isk","lan'r"];

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function makeSyllable(allowCoda = true) {
  let s = pick(onsets) + pick(vowels);
  if (allowCoda && Math.random() < 0.5) {
    s += pick(codas);
  }
  return s;
}

function generateFantasyMaleName() {
  let syllableCount = Math.random() < 0.7 ? 1 : 2;
  let base = "";

  for (let i = 0; i < syllableCount; i++) {
    base += makeSyllable(i === 0);
  }

  let suffix = pick(suffixes);

  const lastBaseChar = base.slice(-1);
  const firstSuffixChar = suffix.replace("'", "").charAt(0);
  if (lastBaseChar === firstSuffixChar) {
    base = base.slice(0, -1);
  }

  let name = base + suffix;

  name = name
    .replace(/[cC]/g, "")
    .replace(/([aeiou])\1/g, "$1")
    .replace(/el'l/g, "el")
    .toLowerCase();

  return name.charAt(0).toUpperCase() + name.slice(1);
}

// ---------- MAIN GENERATOR ----------
async function generateNames() {
  const category = document.getElementById("category").value;
  const gender = document.getElementById("gender").value;
  const count = parseInt(document.getElementById("count").value) || 1;
  let names = [];

  try {
    if (category === "real") {
      let apiURL = `https://randomuser.me/api/?results=${count}&inc=name&nat=us,gb,ca,au,nz`;
      if (gender !== "all") apiURL += `&gender=${gender}`;
      const res = await fetch(apiURL);
      const data = await res.json();
      names = data.results.map(u => `${u.name.first} ${u.name.last}`);
    } else {
      for (let i = 0; i < count; i++) {
        names.push(generateFantasyMaleName());
      }
    }
  } catch (err) {
    names = ["Error: " + err.message];
  }

  document.getElementById("name-output").innerHTML = names.join("<br>");
}

document.getElementById("generate-btn")
  .addEventListener("click", generateNames);

// ---------- NEW: BASE NAME + SUFFIX VARIANTS ----------
function generateEndings() {
  const baseInput = document.getElementById("base-name").value.trim();
  if (!baseInput) return;

  let base = baseInput
    .replace(/[cC]/g, "")
    .toLowerCase();

  const results = suffixes.map(suffix => {
    let b = base;
    const last = b.slice(-1);
    const first = suffix.replace("'", "").charAt(0);

    if (last === first) {
      b = b.slice(0, -1);
    }

    let name = (b + suffix)
      .replace(/el'l/g, "el");

    return name.charAt(0).toUpperCase() + name.slice(1);
  });

  document.getElementById("ending-output").innerHTML =
    results.join("<br>");
}

document.getElementById("ending-btn")
  .addEventListener("click", generateEndings);
</script>

</body>
</html>
