<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Name Generator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    color: #4ce1ff;
  }
  select, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
  }
  #name-output {
    margin-top: 20px;
    font-size: 28px;
    font-weight: bold;
    color: #ffb74d;
  }
</style>
</head>
<body>

<h1>API Name Generator</h1>

<label for="category">Select Type:</label>
<select id="category">
  <option value="real">Real Name</option>
  <option value="username">Username</option>
</select>

<button id="generate-btn">Generate Name</button>

<div id="name-output">Your name will appear here</div>

<script>
async function generateName() {
  const category = document.getElementById("category").value;
  let name = "Error generating name";

  try {
    if(category === "real") {
      // RandomUser API
      const res = await fetch('https://randomuser.me/api/?inc=name&nat=us');
      const data = await res.json();
      const user = data.results[0].name;
      name = `${user.first} ${user.last}`;
    } else if(category === "username") {
      // Random Username API
      const res = await fetch('https://usernameapiv1.vercel.app/api/random-usernames?count=1');
      const data = await res.json();
      name = data.usernames[0];
    }
  } catch(err) {
    name = "API error: " + err.message;
  }

  document.getElementById("name-output").innerText = name;
}

document.getElementById("generate-btn").addEventListener("click", generateName);
</script>

</body>
</html>
