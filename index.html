<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NameForge v0.24</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { color: #4ce1ff; }
  select, input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
  }
  .section {
    border: 1px solid #333;
    padding: 15px;
    margin-top: 20px;
    width: 100%;
    max-width: 500px;
    text-align: center;
  }
  #name-output, #manual-output {
    margin-top: 15px;
    font-size: 20px;
    color: #ffb74d;
  }
</style>
</head>
<body>

<h1>NameForge v0.24</h1>

<!-- ---------------- Main Terradine Section ---------------- -->
<div class="section">
  <label for="category">Select Type:</label>
  <select id="category">
    <option value="real">Real Name</option>
    <option value="terradine">Terradine</option>
    <option value="manual">Terradine Manual</option>
  </select>

  <label for="gender">Select Gender:</label>
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>

  <label for="count">Number of names:</label>
  <input type="number" id="count" value="5" min="1" max="50">

  <button id="generate-btn">Generate Names</button>
  <div id="name-output"></div>
</div>

<!-- ---------------- Terradine Manual Section ---------------- -->
<div class="section" id="manual-section" style="display:none;">
  <h3>Terradine Manual</h3>
  <input type="text" id="base-name" placeholder="Base name (e.g. Dor, Thal, Nim)">
  <div style="margin-top:10px;">
    <label><input type="radio" name="manual-gender" value="male" checked> Male endings</label>
    &nbsp;&nbsp;
    <label><input type="radio" name="manual-gender" value="female"> Female endings</label>
  </div>
  <button id="manual-btn">Generate Variants</button>
  <div id="manual-output"></div>
</div>

<script src="terradine.js"></script>
<script>
  // Toggle manual section visibility
  const categorySelect = document.getElementById("category");
  const manualSection = document.getElementById("manual-section");
  categorySelect.addEventListener("change", () => {
    manualSection.style.display = categorySelect.value === "manual" ? "block" : "none";
  });

  // Main generation
  document.getElementById("generate-btn").addEventListener("click", async () => {
    const category = categorySelect.value;
    const gender = document.getElementById("gender").value;
    const count = parseInt(document.getElementById("count").value) || 1;
    let names = [];

    try {
      if(category === "real"){
        let apiURL = `https://randomuser.me/api/?results=${count}&inc=name&nat=us,gb,ca,au,nz`;
        if(gender !== "all") apiURL += `&gender=${gender}`;
        const res = await fetch(apiURL);
        const data = await res.json();
        names = data.results.map(u => `${u.name.first} ${u.name.last}`);
      } else if(category === "terradine") {
        for(let i=0; i<count; i++){
          names.push(generateTerradineName(gender));
        }
      }
    } catch(err){
      names = ["Error: " + err.message];
    }

    document.getElementById("name-output").innerHTML = names.join("<br>");
  });

  // Terradine Manual generation
  document.getElementById("manual-btn").addEventListener("click", () => {
    const base = document.getElementById("base-name").value.trim();
    if(!base) return;
    const gender = document.querySelector('input[name="manual-gender"]:checked').value;
    const variants = generateTerradineSuffixes(base, gender);
    document.getElementById("manual-output").innerHTML = variants.join("<br>");
  });
</script>

</body>
</html>
