<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Name & Fantasy Generator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { color: #4ce1ff; }
  select, input, button { padding: 10px; margin: 5px; font-size: 16px; }
  #name-output { margin-top: 20px; font-size: 20px; color: #ffb74d; text-align: center; }
</style>
</head>
<body>

<h1>Multi-Name & Fantasy Generator</h1>

<label for="category">Select Type:</label>
<select id="category">
  <option value="real">Real Name</option>
  <option value="username">Username</option>
  <option value="fantasy">Fantasy Male</option>
</select>

<label for="gender">Select Gender:</label>
<select id="gender">
  <option value="all">All</option>
  <option value="male">Male</option>
  <option value="female">Female</option>
</select>

<label for="count">Number of names:</label>
<input type="number" id="count" value="5" min="1" max="50">

<button id="generate-btn">Generate Names</button>

<div id="name-output">Names will appear here</div>

<script>
// ----- Fantasy male generator setup -----
const fantasyPrefixes = ["Ar","Thal","Ka","Dor","Syl","El","Nim"];
const fantasySuffixesMale = ["'R","'k","'s","'l","'n","Ron","ar","rik","vek","ald","rak","isk","lan'r"];
const vowels = ["a","e","i","o","u","ae","io"];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function generateFantasyMaleName(){
  const prefix = pick(fantasyPrefixes);
  const suffixRaw = pick(fantasySuffixesMale);

  // Only single-letter suffixes get apostrophe
  const singleLetterSuffixes = ["r","k","s","l","n"];
  let suffix = suffixRaw;
  if(singleLetterSuffixes.includes(suffixRaw.replace("'",""))){
    suffix = "'" + suffixRaw.replace("'","");
  }

  // Optional vowel middle for smoother flow
  const mid = Math.random() < 0.6 ? pick(vowels) : "";

  let name = prefix + mid + suffix;

  // Remove forbidden letters C and Z
  name = name.replace(/[cCzZ]/g,"");

  // Capitalize first letter
  name = name.charAt(0).toUpperCase() + name.slice(1);

  return name;
}

// ----- Main generator function -----
async function generateNames() {
  const category = document.getElementById("category").value;
  const gender = document.getElementById("gender").value;
  const count = parseInt(document.getElementById("count").value) || 1;
  let names = [];

  try {
    if(category === "real") {
      // Western real names
      let apiURL = `https://randomuser.me/api/?results=${count}&inc=name&nat=us,gb,ca,au,nz`;
      if(gender !== "all") apiURL += `&gender=${gender}`;
      const res = await fetch(apiURL);
      const data = await res.json();
      names = data.results.map(u => `${u.name.first} ${u.name.last}`);
    } else if(category === "username") {
      const res = await fetch(`https://usernameapiv1.vercel.app/api/random-usernames?count=${count}`);
      const data = await res.json();
      names = data.usernames;
    } else if(category === "fantasy") {
      for(let i=0;i<count;i++){
        names.push(generateFantasyMaleName());
      }
    }
  } catch(err) {
    names = ["Error: " + err.message];
  }

  document.getElementById("name-output").innerHTML = names.join("<br>");
}

document.getElementById("generate-btn").addEventListener("click", generateNames);
</script>

</body>
</html>
