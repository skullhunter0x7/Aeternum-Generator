<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NameForge v0.13</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { color: #4ce1ff; }
  select, input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
  }
  #name-output {
    margin-top: 20px;
    font-size: 20px;
    color: #ffb74d;
    text-align: center;
  }
</style>
</head>
<body>

<h1>NameForge v0.13 — Nordic</h1>

<label for="count">Number of names:</label>
<input type="number" id="count" value="5" min="1" max="50">

<button id="generate-btn">Generate Names</button>

<div id="name-output">Names will appear here</div>

<script>
// ------------------ Nordic name system ------------------

// Human-friendly Nordic starts
const onsets = [
  "Al","Ar","Bal","Bor","Dar","Eir","Fen","Hal","Har",
  "Ing","Jor","Kar","Ran","Sig","Tor","Ulf","Var"
];

// Simple, pronounceable vowel cores
const cores = ["a","e","i","o","u","ar","or","an","ir"];

// Allowed endings ONLY
const endings = [
  "'r","'k","'s","'l","'n",
  "ron","ar","rik","vek","ald","rak","isk","lan'r"
];

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function syllableCount(name) {
  return (name.match(/[aeiouy]/gi) || []).length;
}

function generateNordicName() {
  let start = pick(onsets);
  let core = Math.random() < 0.7 ? pick(cores) : "";
  let end = pick(endings);

  let name = start + core + end;

  // Hard rules
  name = name.replace(/el'l/gi, ""); // absolute ban
  name = name.replace(/c/gi, "");    // no C ever
  name = name.replace(/z/gi, "");    // no Z for now

  // Prevent ugly consonant piles
  if (/[bcdfghjklmnpqrstvwxyz]{4,}/i.test(name)) {
    return generateNordicName();
  }

  // Keep it human-length
  if (syllableCount(name) > 3 || name.length > 10) {
    return generateNordicName();
  }

  // Capitalize first letter only
  name = name.charAt(0).toUpperCase() + name.slice(1);

  return name;
}

function generateNames() {
  const count = parseInt(document.getElementById("count").value) || 1;
  let names = [];
  for (let i = 0; i < count; i++) {
    names.push(generateNordicName());
  }
  document.getElementById("name-output").innerHTML = names.join("<br>");
}

document.getElementById("generate-btn").addEventListener("click", generateNames);
</script>

</body>
</html>
