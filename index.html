<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Name API Generator with Gender</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    color: #4ce1ff;
  }
  select, input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
  }
  #name-output {
    margin-top: 20px;
    font-size: 20px;
    color: #ffb74d;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Multi-Name API Generator</h1>

<label for="category">Select Type:</label>
<select id="category">
  <option value="real">Real Name</option>
  <option value="username">Username</option>
</select>

<label for="gender">Select Gender:</label>
<select id="gender">
  <option value="all">All</option>
  <option value="male">Male</option>
  <option value="female">Female</option>
</select>

<label for="count">Number of names:</label>
<input type="number" id="count" value="5" min="1" max="50">

<button id="generate-btn">Generate Names</button>

<div id="name-output">Names will appear here</div>

<script>
async function generateNames() {
  const category = document.getElementById("category").value;
  const gender = document.getElementById("gender").value;
  const count = parseInt(document.getElementById("count").value) || 1;
  let names = [];

  try {
    if(category === "real") {
      let apiURL = `https://randomuser.me/api/?results=${count}&inc=name&nat=us`;
      if(gender !== "all") apiURL += `&gender=${gender}`;
      const res = await fetch(apiURL);
      const data = await res.json();
      names = data.results.map(u => `${u.name.first} ${u.name.last}`);
    } else if(category === "username") {
      const res = await fetch(`https://usernameapiv1.vercel.app/api/random-usernames?count=${count}`);
      const data = await res.json();
      names = data.usernames;
    }
  } catch(err) {
    names = ["API error: " + err.message];
  }

  document.getElementById("name-output").innerHTML = names.join("<br>");
}

document.getElementById("generate-btn").addEventListener("click", generateNames);
</script>

</body>
</html>
