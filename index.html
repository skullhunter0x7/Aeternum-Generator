<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NameForge v0.23</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h1 { color: #4ce1ff; }
  .section { border: 1px solid #333; padding: 15px; margin-top: 20px; width: 100%; max-width: 500px; text-align: center; }
  input, select, button { padding: 8px; margin: 5px; font-size: 16px; }
  #name-output { margin-top: 15px; font-size: 20px; color: #ffb74d; }
  .inline { display: inline-block; margin: 0 5px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>NameForge v0.23</h1>

<div class="section">
  <select id="category">
    <option value="real">Real Name</option>
    <option value="terradine">Terradine</option>
    <option value="custom">Custom Base + Suffix</option>
  </select>

  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>

  <input type="number" id="count" value="5" min="1" max="50">

  <!-- Custom Base Input -->
  <input type="text" id="base-name" placeholder="Base name" class="hidden">
  <div id="base-options" class="hidden">
    <label class="inline"><input type="radio" name="ending-gender" value="male" checked> Male endings</label>
    <label class="inline"><input type="radio" name="ending-gender" value="female"> Female endings</label>
  </div>

  <button id="generate-btn">Generate Names</button>
  <div id="name-output"></div>
</div>

<script src="terradine.js"></script>
<script src="realnames.js"></script>
<script>
const categorySelect = document.getElementById("category");
const baseInput = document.getElementById("base-name");
const baseOptions = document.getElementById("base-options");
const output = document.getElementById("name-output");

// Show/hide base input for custom
categorySelect.addEventListener("change", ()=>{
  if(categorySelect.value === "custom"){
    baseInput.classList.remove("hidden");
    baseOptions.classList.remove("hidden");
  } else {
    baseInput.classList.add("hidden");
    baseOptions.classList.add("hidden");
  }
});

// Main generate function
document.getElementById("generate-btn").addEventListener("click", async ()=>{
  const category = categorySelect.value;
  const gender = document.getElementById("gender").value;
  const count = parseInt(document.getElementById("count").value)||1;
  let names = [];

  if(category === "real"){
    names = await generateRealNames(count, gender);
  } else if(category === "terradine"){
    names = Array.from({length:count}, ()=>generateTerradineName(gender));
  } else if(category === "custom"){
    const base = baseInput.value.trim();
    if(base) names = generateTerradineSuffixes(base, document.querySelector('input[name="ending-gender"]:checked').value);
  }

  output.innerHTML = names.join("<br>");
});
</script>

</body>
</html>
