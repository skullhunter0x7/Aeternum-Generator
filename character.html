<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Generator v0.2</title>
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }
  h1 { color: #4ce1ff; margin-bottom: 20px; }
  label, select, input, button { margin: 5px; font-size: 16px; }
  select, input { padding: 8px; width: 250px; }
  button { padding: 10px 20px; margin-top: 20px; }
  #character-output { margin-top: 20px; font-size: 18px; color: #ffb74d; white-space: pre-line; text-align: left; }
  a { color: #4ce1ff; margin-top: 20px; }
  .input-group { margin: 10px 0; display: flex; flex-direction: column; width: 250px; }
  .buttons { display: flex; gap: 10px; }
</style>
</head>
<body>

<h1>Character Generator</h1>

<div class="input-group">
  <label for="char-name">Name (optional):</label>
  <input type="text" id="char-name" placeholder="Enter a name">
  <small style="color:#aaa;">If you can't think of one yourself, visit <a href="nameforge.html" style="color:#4ce1ff;">NameForge</a></small>
</div>

<div class="input-group">
  <label for="char-gender">Gender:</label>
  <select id="char-gender">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>
</div>

<div class="input-group">
  <label for="char-age">Age:</label>
  <input type="number" id="char-age" min="1" max="1000" value="25">
</div>

<div class="input-group">
  <label for="char-planet">Planet:</label>
  <select id="char-planet">
    <option value="Vireth">Vireth</option>
    <option value="Terradine">Terradine</option>
    <option value="Aethere">Aethere</option>
    <option value="Oran">Oran</option>
  </select>
</div>

<div class="buttons">
  <button id="generate-btn">Generate Character</button>
  <button id="random-btn">Randomize All</button>
</div>

<div id="character-output"></div>

<a href="index.html">← Back to Hub</a>

<script src="js/character.js"></script>
</body>
</html>
